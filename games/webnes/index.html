<!DOCTYPE html>
<html>

<head>
    <title>Game Launcher</title>
    <meta charset="UTF-8">
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        #game {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }

        ruffle-embed,
        object,
        embed {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div id="game">
        <embed src="https://cdn.jsdelivr.net/gh/bananabitbread/bananabitbread.github.io@main/bancli/add_v8.swf"
            type="application/x-shockwave-flash" />
    </div>
</body>

</html>
